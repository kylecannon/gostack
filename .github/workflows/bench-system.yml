name: bench-system

# The system bench (docs/standards.md, "Benchmarks"; bench/doc.go).
#
# A pull request builds the base and the head image on the same runner, runs the
# quick profile for gostack alone against both in one `bench run -base-image`,
# which alternates the two images in every repeated measurement, and compares
# the two results with `bench compare`, which fails the job when a gostack cell
# regressed with non-overlapping runs and bench/accepted.yaml does not hold it. Both result
# files are uploaded and the comparison goes to the step summary. In both jobs
# the checkout the comparison runs in has its full history, because the
# accepted list asks git whether the base and the head hold an entry's commit.
#
# The weekly schedule, and a manual run with the full profile, run the whole
# matrix for gostack, gostack-slim and LocalStack (reference only, never gating)
# and compare the result with the last passing run on main that had the same
# profile and host fingerprint. Each such run uploads its result as a workflow
# artifact for the next one to download. The first run of a profile on a host
# has no artifact, says so, and passes. The results committed under
# bench/results are human records and no job reads them: a runner never has
# the fingerprint of the laptop they were taken on.

on:
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - "docker/**"
      - "bench/**"
      - "go.mod"
  workflow_dispatch:
    inputs:
      profile:
        description: "quick: each axis once, gostack only. full: the whole matrix, with LocalStack as reference."
        type: choice
        options:
          - quick
          - full
        default: quick
      localstack_image:
        description: "The LocalStack image the full profile measures as reference."
        type: string
        default: localstack/localstack:latest
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# GitHub runs a bare bash step with -e only. Naming the shell adds -o pipefail,
# so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@v7
        with:
          go-version-file: head/go.mod
          cache: true
          cache-dependency-path: |
            head/go.sum
            base/go.sum
      # Main has no image until the pull request that adds docker/Dockerfile
      # merges. A base without one leaves nothing to measure, so the job says so
      # in the summary and skips the steps below, which keeps it green.
      - name: Check that the base has an image
        id: base
        run: |
          if [ -f base/docker/Dockerfile ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "base has no image to measure; nothing to compare" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The head's Makefile and Dockerfile logic builds both trees, so a base
      # that predates a Make target is still measured.
      - name: Build the base image
        if: steps.base.outputs.image == 'true'
        working-directory: base
        run: make -f ../head/Makefile image IMAGE=gostack:base
      - name: Build the head image
        if: steps.base.outputs.image == 'true'
        working-directory: head
        run: make image IMAGE=gostack:head
      # One run measures both images with the head's load generator. It alternates
      # them in every repeated measurement (base head, head base, ...), so a
      # runner that slows down or speeds up during the job moves both sides alike.
      # The base's result goes under base/ and the head's under head/. Each cell
      # runs five times a side, not the default three: compare fails a metric
      # whose ranges do not overlap, which three runs a side of pure noise do
      # once in C(6,3) = 20 orderings and five once in C(10,5) = 252. The time to
      # the first signed SNS publish is not judged by ranges: a key generation
      # spreads too widely for them. It keeps its own runs, -first-use-runs (30
      # a side, not -reps), and fails on a rank-sum test of them (bench/doc.go,
      # "The gate").
      - name: Measure the base and the head
        if: steps.base.outputs.image == 'true'
        working-directory: head
        run: |
          go run ./bench run -profile quick -targets gostack -reps 5 \
            -base-image gostack:base -base-commit "$BASE_SHA" -base-out "$RUNNER_TEMP/base" \
            -gostack-image gostack:head -commit "$HEAD_SHA" -out "$RUNNER_TEMP/head"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Compare
        if: steps.base.outputs.image == 'true'
        working-directory: head
        run: |
          base=$(ls "$RUNNER_TEMP"/base/*.json)
          head=$(ls "$RUNNER_TEMP"/head/*.json)
          status=0
          go run ./bench compare -accepted bench/accepted.yaml -base "$base" -head "$head" 2>&1 \
            | tee "$RUNNER_TEMP/compare.md" || status=$?
          cat "$RUNNER_TEMP/compare.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && steps.base.outputs.image == 'true'
        with:
          name: bench-system-pull-request
          path: |
            ${{ runner.temp }}/base/*.json
            ${{ runner.temp }}/head/*.json
            ${{ runner.temp }}/compare.md

  scheduled:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # actions: read lets `gh api` list the earlier artifacts and download-artifact
    # fetch one from another run.
    permissions:
      contents: read
      actions: read
    env:
      PROFILE: ${{ github.event_name == 'schedule' && 'full' || inputs.profile }}
      LOCALSTACK_IMAGE: ${{ inputs.localstack_image || 'localstack/localstack:latest' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the images
        run: |
          make image IMAGE=gostack:ci
          if [ "$PROFILE" = full ]; then
            make image-slim IMAGE=gostack:ci
            docker pull "$LOCALSTACK_IMAGE"
          fi
      # The full profile measures all three images; the quick one gostack alone.
      # LocalStack is reference only. The comparison is a step of its own, below.
      - name: Measure
        run: |
          targets=gostack
          if [ "$PROFILE" = full ]; then targets=gostack,gostack-slim,localstack; fi
          go run ./bench run -profile "$PROFILE" -targets "$targets" \
            -gostack-image gostack:ci -slim-image gostack:ci-slim -localstack-image "$LOCALSTACK_IMAGE" \
            -out "$RUNNER_TEMP/bench"
      # The artifact is named for the profile and the host fingerprint (OS,
      # architecture, CPUs, Docker version, OrbStack), the fields `bench compare`
      # holds equal. A runner whose Docker or CPU count changed names a new
      # artifact and starts a new baseline.
      - name: Name the baseline
        id: baseline
        run: |
          result=$(ls "$RUNNER_TEMP"/bench/*.json)
          key=$(jq -r '.host.fingerprint | "\(.os)-\(.arch)-\(.cpus)cpu-docker\(.docker)-orbstack\(.orbstack)"' "$result" \
            | tr -c 'A-Za-z0-9._\n-' '-')
          fingerprint=$(jq -r '.host.fingerprint | "\(.os)/\(.arch), \(.cpus) CPUs, Docker \(.docker), OrbStack \(.orbstack)"' "$result")
          {
            echo "result=$result"
            echo "name=bench-system-$PROFILE-$key"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
      # The newest artifact of that name that a run on main uploaded and that has
      # not expired. Only a run that passed uploads one, so a regression is not
      # the next run's baseline. This run's own id is left out for a re-run.
      - name: Find the previous result
        id: previous
        env:
          NAME: ${{ steps.baseline.outputs.name }}
        # A fork's branch can also be called main, so the head repository id is
        # what keeps a fork's run from becoming the baseline.
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == ($ENV.GITHUB_REPOSITORY_ID | tonumber) and .workflow_run.id != ($ENV.GITHUB_RUN_ID | tonumber))] | max_by(.created_at) | .workflow_run.id // empty')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run-id != ''
        with:
          name: ${{ steps.baseline.outputs.name }}
          run-id: ${{ steps.previous.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      # With no earlier result the step says so and passes. That is the first run
      # of a profile on a host, or the first after the artifact expired.
      - name: Compare with the previous result
        env:
          RESULT: ${{ steps.baseline.outputs.result }}
          NAME: ${{ steps.baseline.outputs.name }}
          FINGERPRINT: ${{ steps.baseline.outputs.fingerprint }}
          PREVIOUS_RUN: ${{ steps.previous.outputs.run-id }}
        run: |
          status=0
          if [ -z "$PREVIOUS_RUN" ]; then
            {
              echo "## System bench compare"
              echo
              echo "No earlier result from main is stored as \`$NAME\`, so there is nothing to compare against."
              echo "It looked for the fingerprint $FINGERPRINT. This run is stored as the baseline for the next one."
            } | tee "$RUNNER_TEMP/compare.md"
          else
            previous=$(find "$RUNNER_TEMP/previous" -name '*.json' | head -n 1)
            if [ -z "$previous" ]; then
              echo "run $PREVIOUS_RUN stored \`$NAME\` with no result file in it" | tee "$RUNNER_TEMP/compare.md"
              status=1
            else
              go run ./bench compare -accepted bench/accepted.yaml -base "$previous" -head "$RESULT" 2>&1 \
                | tee "$RUNNER_TEMP/compare.md" || status=$?
            fi
          fi
          cat "$RUNNER_TEMP/compare.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The baseline for the next run: stored only when this run passed.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.name }}
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/*.md
            ${{ runner.temp }}/compare.md
          retention-days: 90
          overwrite: true
      # A failed run keeps its numbers for a look, under a name no run reads.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bench-system-${{ env.PROFILE }}-failed
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/*.md
            ${{ runner.temp }}/compare.md
          if-no-files-found: ignore
          overwrite: true
