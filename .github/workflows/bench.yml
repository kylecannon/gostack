name: bench

# Runs every benchmark in the repo on the base and the head of a pull request,
# compares them with benchstat, and fails on a regression over 10% at p<0.05
# that bench/accepted.yaml does not hold (docs/standards.md, "Benchmarks"). The
# comparison is `go run ./bench gate`.

on:
  pull_request:

permissions:
  contents: read

# GitHub runs a bare bash step with -e only. Naming the shell adds -o pipefail,
# so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  benchstat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The gate asks git whether the base and the head hold an accepted
      # entry's commit, which takes the head checkout's full history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@v7
        with:
          go-version-file: head/go.mod
          cache: true
          cache-dependency-path: |
            head/go.sum
            base/go.sum
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261117185222-4febdb082b2c
      # The head's Makefile runs on both trees, so a base that predates
      # `make bench` is still measured.
      - name: Benchmark the base
        working-directory: base
        run: make -f ../head/Makefile bench BENCH_OUT="$GITHUB_WORKSPACE/base.txt"
      - name: Benchmark the head
        working-directory: head
        run: make bench BENCH_OUT="$GITHUB_WORKSPACE/head.txt"
      - name: Compare
        id: compare
        run: |
          if ! grep -q '^Benchmark' base.txt; then
            echo "The base has no benchmarks, so there is nothing to compare against." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "compared=true" >> "$GITHUB_OUTPUT"
          benchstat base.txt head.txt | tee benchstat.txt
          {
            echo '```'
            cat benchstat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a regression over 10% at p<0.05
        if: steps.compare.outputs.compared == 'true'
        working-directory: head
        run: |
          status=0
          go run ./bench gate -accepted bench/accepted.yaml -base "$BASE_SHA" -head "$HEAD_SHA" \
            < "$GITHUB_WORKSPACE/benchstat.txt" | tee "$RUNNER_TEMP/gate.txt" || status=$?
          {
            echo '```'
            cat "$RUNNER_TEMP/gate.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
