name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # --diff prints what the formatters would change and fails on any.
      - run: make fmt FMT_ARGS=--diff
      - run: make tidy-check
      - run: make gen-check
      - run: make fix-check
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make test

  # The ledger tools are Python on the runner's own python3, no Go and no Docker.
  # Runs the parity/test_*.py unit tests, then compares the ledger with HEAD.
  parity-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make parity-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make build
