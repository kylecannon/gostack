name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub runs a bare bash step with -e only. Naming the shell adds -o pipefail,
# so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # --diff prints what the formatters would change and fails on any.
      - run: make fmt FMT_ARGS=--diff
      - run: make tidy-check
      - run: make gen-check
      - run: make features-check
      - run: make fix-check
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make test

  # The ledger tools are Python on the runner's own python3, no Go and no Docker.
  # Runs the parity/test_*.py unit tests, then compares the ledger with the base.
  # A pull request compares the merge ref with HEAD^1, the base GitHub merged
  # into, exactly as parity.yml does; base.sha in the event can be older than
  # that. A push to main compares with the commit main was at before it.
  parity-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit holds the ledger the change is compared with.
          fetch-depth: 0
      - name: Compare the ledger with the base
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$BEFORE
          if [ "$EVENT" = pull_request ]; then
            base=$(python3 parity/ledger.py merge-parent --head "$PR_HEAD")
          fi
          make parity-check PARITY_BASE="$base"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make build
