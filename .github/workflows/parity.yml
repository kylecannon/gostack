name: parity

# LocalStack's own pytest suite, run unchanged against a gostack image built
# from the merged result of the pull request (docs/architecture.md, "Parity
# oracle").
#
# A pull request run checks out GitHub's merge ref (github.sha, as ci.yml
# does): the pull request head merged into its base. The image, the tests and
# the ledger all come from that tree, and it is compared with HEAD^1, the base
# commit GitHub merged into. `parity/ledger.py merge-parent` fails the job when
# HEAD is not a two-parent merge whose second parent is the pull request head,
# and the select step fails when GitHub reports the pull request as not
# mergeable. Nothing falls back to the head alone.
#
# The services come from the paths changed between HEAD^1 and HEAD, read with
# `git diff --name-only -z --no-renames` so a quoted name and both sides of a
# rename are seen. `parity/ledger.py services --changed` holds the rules: a
# path selects every service in the ledger unless it is one service's own
# (internal/service/<svc>/, or internal/api/<svc>/ once internal/service/<svc>/
# exists, which also select the services whose tests depend on <svc> in
# DEPENDS_ON, and every service when <svc> is in ROUTING_REACH, or
# parity/ledger/<svc>.json, parity/exclusions/<svc>.yaml), or cannot change
# the image (NO_IMAGE_EFFECT, and every *_test.go). cmd/gostack/services.go
# selects the services named by its changed lines when each is a whole
# registrations() entry or a service import, and every service otherwise.
#
# A manual run takes a services input, builds the dispatched ref, and compares
# with the ledger committed at that ref (HEAD).
#
# CI never runs the LocalStack baseline. The localstack column of the committed
# parity/ledger/<service>.json is the baseline. `make parity-check` fails when
# a test that passed in the gostack column at the base no longer passes and
# parity/demotions.yaml does not list it. On a pull request the gostack column
# this run observed for the selected services must also equal the one
# committed in the merged tree: the ratchet protects what is committed, so it
# has to be what CI saw. The suite comes from localstack/localstack at the
# commit pinned in specs/SOURCES.lock. When GitHub cannot serve that commit the
# job stops, and nothing is vendored in its place.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to run, comma separated, as the ledger names them (sqs,sts). Empty runs every service in the ledger."
        type: string
        default: ""

permissions:
  contents: read

# GitHub runs a bare bash step with -e only. Naming the shell adds -o pipefail,
# so a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: parity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # The tag of the runner image inside this job. The cache key carries the
  # LocalStack sha, so the tag does not have to.
  PARITY_RUNNER_IMAGE: gostack-parity-runner:ci
  GOSTACK_IMAGE: gostack:parity

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The default ref: on a pull request, GitHub's merge ref. fetch-depth 0
      # brings both of its parents. LocalStack sits beside the gostack
      # checkout, where parity/run.sh looks for it (../localstack).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: gostack

      - name: Select the services
        id: select
        working-directory: gostack
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGEABLE: ${{ github.event.pull_request.mergeable }}
          REQUESTED: ${{ inputs.services }}
        run: |
          base=
          if [ "$EVENT" = workflow_dispatch ]; then
            services=${REQUESTED:-$(python3 parity/ledger.py services)}
          else
            # null (not computed yet) reads as empty; HEAD's shape is checked next.
            [ "$MERGEABLE" != false ] || { echo "GitHub reports the pull request as not mergeable: there is no merged tree to test" >&2; exit 1; }
            base=$(python3 parity/ledger.py merge-parent --head "$PR_HEAD")
            services=$(git diff --name-only -z --no-renames "$base" HEAD | python3 parity/ledger.py services --changed --range "$base..HEAD")
          fi
          case "$services" in
          *[!a-z0-9_,]*) echo "services '$services' is not a comma separated list of service names" >&2; exit 1 ;;
          esac
          sha=$(awk '$1 == "localstack_sha" { print $2 }' specs/SOURCES.lock)
          case "$sha" in
          *[!0-9a-f]* | '') echo "specs/SOURCES.lock has no localstack_sha" >&2; exit 1 ;;
          esac
          [ "${#sha}" = 40 ] || { echo "localstack_sha '$sha' is not a full commit sha" >&2; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "localstack_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Services: ${services:-none, no changed path affects a service}. LocalStack: $sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch LocalStack at the pinned commit
        if: steps.select.outputs.services != ''
        uses: actions/checkout@v7
        with:
          repository: localstack/localstack
          ref: ${{ steps.select.outputs.localstack_sha }}
          path: localstack

      - name: Check the LocalStack commit
        if: steps.select.outputs.services != ''
        env:
          WANT: ${{ steps.select.outputs.localstack_sha }}
        run: |
          got=$(git -C localstack rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "LocalStack is at $got, want $WANT" >&2; exit 1; }

      - name: Restore the runner image
        id: runner-cache
        if: steps.select.outputs.services != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/parity-runner.tar
          key: parity-runner-${{ steps.select.outputs.localstack_sha }}-${{ hashFiles('gostack/parity/runner/**') }}

      - name: Load the cached runner image
        if: steps.select.outputs.services != '' && steps.runner-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/parity-runner.tar"

      - name: Build the runner image
        if: steps.select.outputs.services != '' && steps.runner-cache.outputs.cache-hit != 'true'
        working-directory: gostack
        run: |
          parity/run.sh runner
          docker save --output "$RUNNER_TEMP/parity-runner.tar" "$PARITY_RUNNER_IMAGE"

      - name: Save the runner image
        if: steps.select.outputs.services != '' && steps.runner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/parity-runner.tar
          key: ${{ steps.runner-cache.outputs.cache-primary-key }}

      - name: Build the gostack image from the merged tree
        if: steps.select.outputs.services != ''
        working-directory: gostack
        run: make image IMAGE="$GOSTACK_IMAGE"

      - name: Run LocalStack's tests against gostack
        id: run
        if: steps.select.outputs.services != ''
        working-directory: gostack
        env:
          SERVICES: ${{ steps.select.outputs.services }}
          PARITY_RUNNER_PREBUILT: "1"
        run: make parity

      # The ledger the change is compared with is the one at HEAD^1, the base
      # GitHub merged the pull request into, as the select step printed it. A
      # manual run has no base and compares with HEAD.
      - name: Fail on a regression
        if: steps.select.outputs.services != ''
        working-directory: gostack
        env:
          EVENT: ${{ github.event_name }}
          PARITY_BASE: ${{ steps.select.outputs.base }}
        run: |
          if [ "$EVENT" != workflow_dispatch ] && [ -z "$PARITY_BASE" ]; then
            echo "no base to compare the ledger with" >&2
            exit 1
          fi
          make parity-check

      # The ratchet protects the committed ledger, so on a pull request it has
      # to be the one this run observed: a fix cannot merge without its row
      # turning pass, and a committed row of a selected service whose test the
      # run did not collect (its junit report and the plugin's excluded list)
      # fails unless it is excluded or demoted. Only the selected services ran.
      # It runs after a failed regression check too, so both reports show. A
      # manual run is how a ledger to commit is made, and is not gated here.
      # docs/parity.md is checked against the committed ledger by the ledger
      # unit tests in make parity-check, here and in ci.yml.
      - name: Fail on an uncommitted ledger
        if: always() && github.event_name == 'pull_request' && steps.run.outcome == 'success'
        working-directory: gostack
        env:
          SERVICES: ${{ steps.select.outputs.services }}
        run: python3 parity/ledger.py uncommitted --services "$SERVICES" --rev HEAD --junit parity/out/gostack/junit.xml --excluded parity/out/gostack/excluded.json

      - name: Report
        if: always() && steps.select.outputs.services != ''
        working-directory: gostack
        run: cat docs/parity.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.services != ''
        with:
          name: parity
          path: |
            gostack/parity/out/gostack
            gostack/parity/ledger/
            gostack/docs/parity.md
