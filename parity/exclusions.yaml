# Tests the parity runner does not run, with the reason for each.
#
# Format: "nodeid pattern": reason
#
# A pattern is a pytest nodeid, optionally with `*` wildcards. Without a
# wildcard it matches that nodeid and every parametrization of it
# (`...::test_x` covers `...::test_x[a]` and `...::test_x[b]`). parity/pytest_gostack.py
# skips the matching tests with the reason `excluded: <reason>` and records them in
# the ledger as `excluded` for both columns, so they stay visible.
#
# Reasons in use:
#   requires_in_process     marked so in LocalStack; it patches state inside the
#                           server process, which no external container can reach.
#                           Tests carrying the marker are always excluded, listed or not.
#   hard-skipped            LocalStack's own source skips the test unconditionally.
#   depends-on:<service>    needs a service outside the current scope.
#   engine-deferred         needs a real engine (OpenSearch, Transcribe) that gostack defers.
#   runner-docker           needs Docker from inside the runner.
#
# Adding an entry for a test that passes is a deferral, not a fix. parity-check
# warns when a passing test turns into an exclusion.

# --- requires_in_process: sqs ---------------------------------------------
"tests/aws/services/sqs/test_sqs.py::TestSqsProvider::test_get_queue_url_contains_localstack_host": requires_in_process
