# The smallest SQS flush (10 queues, no messages) measured 0.79 ms on main and
# 1.12 ms here in CI. The larger flush rows did not move. On Linux outside CI
# the two trees measure the same, so the cause is not found; it is about a
# third of a millisecond on a save that runs once per PERSIST_FREQUENCY.
- gate: benchstat
  package: internal/persist
  benchmark: SQSFlush/queues=10/messages=0
  unit: sec/op
  max: +60%
  reason: the flush gained the two-pass save and its bookkeeping; +0.33 ms on the smallest store in CI, not reproduced locally
  pr: 6
  commit: 99526de6ca85cfb7317c311375f18d13000511d6

- gate: benchstat
  package: internal/persist
  benchmark: SQSFlush/queues=10/messages=0
  unit: B/s
  max: 40%
  reason: the same flush row, as throughput
  pr: 6
  commit: 99526de6ca85cfb7317c311375f18d13000511d6

# The query-protocol SQS receive rows with large payloads measured +11% in one
# CI run and +15% to +27% in the next. This change touches nothing on that
# path: `git diff main...HEAD` is empty for internal/service/sqs,
# internal/protocol, internal/gateway, internal/api and internal/store. The
# sqs test binary links internal/persist through another test file, so the two
# binaries differ in layout though the measured code is the same source.
- gate: benchstat
  package: internal/service/sqs
  benchmark: ReceiveMessage/proto=query/queue=standard/max=1/payload=64KiB
  unit: sec/op
  max: +45%
  reason: the SQS receive path is source-identical to main; only the layout of the test binary differs, because it links the changed persistence package
  pr: 6
  commit: 99526de6ca85cfb7317c311375f18d13000511d6

