# Accepted regressions. `bench gate` (benchstat) and `bench compare` (system
# bench) read this file in CI; docs/standards.md, "Benchmarks", has the rule.
#
# An entry holds a regressed metric that a reviewer accepted as the cost of a
# change. The metric passes while its change stays within max. Anything not
# listed, or past its max, still fails.
#
# An entry applies only to a comparison whose head holds its commit and whose
# base does not. Name a commit that already carries the cost, on the branch the
# pull request merges with a merge commit. Once main holds that commit, every
# later base does too and the entry has expired; delete it then. A squash or
# rebase merge leaves the commit out of main, so such an entry never expires:
# delete the entries in the first change after the merge.
#
# One entry per metric, in one YAML document. Anything else fails the gate. Two
# entries that can match one row count as one metric: a benchmark and the same
# name with a -<digits> suffix ("RouteDetect/host" and "RouteDetect/host-2")
# match the row "RouteDetect/host-2", so listing both is a load error. The file
# holds no entries when nothing is accepted.
#
# An entry that matched no regression (a glob, a stray space, a benchmark that
# is gone), or whose bound is at or under what the gate flags so that it can
# hold none, is printed by both gates under "Unused accepted entries" and does
# not fail them.
#
# Fields:
#   gate:      benchstat, or system for `bench compare`.
#   benchstat: package (its import path, or its path below the module, such as
#              internal/route), benchmark (without the -GOMAXPROCS suffix) and
#              unit, as benchstat prints it.
#   system:    target, cell and metric, as `bench compare` prints them.
#   max:       the largest accepted change, a finite number above zero with at
#              most one leading +: "+50%" (the sign is not read), or for a
#              system metric the worst accepted head median in the metric's
#              unit (MiB, ms, s or cycles/s), such as "6 MiB". A percent is a
#              rise in what the work costs: for a latency, memory or startup
#              the rise itself, and for a throughput (a unit ending in /s,
#              cycles/s) the rise a fall of d percent costs, 100d/(100-d), so
#              "+100%" lets a throughput halve and "+50%" a third of it go.
#              A percent is at most 1000%. An absolute value is at most 65536
#              MiB, 3600000 ms, 3600 s or 10000000 cycles/s, a larger one is a
#              load error; it is a ceiling for a cost and a floor for a
#              throughput, and a pair whose change it allows past the 1000%
#              cap fails like a percent past it. A cost that rises from zero,
#              and in the system gate a throughput that falls to zero, are
#              past every bound. In the benchstat gate a throughput that
#              collapses shows in the sec/op row of the same benchmark, a
#              rise past the 1000% cap that no entry can hold.
#   reason:    one line.
#   pr:        the pull request that accepted it.
#   commit:    a commit that carries the cost.

- gate: benchstat
  package: internal/service/dynamodb
  benchmark: BatchWriteItem/payload=100B/concurrency=1
  unit: sec/op
  max: +20%
  reason: packed items encode each written item once more into its stored form (about 0.5 ns a byte); the large-table system bench is faster at the HTTP level and holds 4.9x the items in 1 GiB (+10.1% on the runners, worst of two runs)
  pr: 79
  commit: e10d655bb875c05bdf06d2c68bdf02d3d538b89f

