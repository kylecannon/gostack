version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - perfsprint
    - revive
    - staticcheck
    - testifylint
    - unparam
    - unused
    - usestdlibvars
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G104 # unhandled errors are errcheck's job
  exclusions:
    generated: lax
    paths:
      - internal/api
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: github.com/kylecannon/gostack
    gci:
      sections:
        - standard
        - default
  exclusions:
    generated: lax
    paths:
      - internal/api
